name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block obvious secret files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..*|.*\.(pem|key|p12|pfx))$'; then
            echo "Secret-like file is tracked. Remove it before publishing."
            exit 1
          fi
      - name: Block obvious token patterns
        shell: bash
        run: |
          if git grep -n -E '(ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- ':!go.sum' ':!internal/redaction/redactor_test.go'; then
            echo "Secret-like token pattern found. Remove or replace with a placeholder."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    needs: secret-patterns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
